name: Compare upstream baseline shard
on:
  push:
    branches:
      - validate/6705-baseline-shard
permissions:
  contents: read
jobs:
  baseline-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ecabd15caa08f674877e155d03c553c30a35a63b
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node --input-type=commonjs -e "require('electron')"
      - name: Run the original Linux shard on upstream
        env:
          OMB_VITEST_E2E: all
          OMB_VITEST_WORKERS: '4'
        run: pnpm exec vitest run --shard=8/8 --reporter=default --reporter=github-actions
