name: Retry macOS paste-link validation shard
on:
  push:
    branches:
      - validate/6705-macos-shard
permissions:
  contents: read
jobs:
  macos-shard:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 22f7ac2db25496b6dac19226bc6a04d120c5907d
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node --input-type=commonjs -e "require('electron')"
      - name: Run the same macOS shard with a longer timeout
        env:
          OMB_VITEST_E2E: host
          OMB_VITEST_WORKERS: '1'
        run: pnpm exec vitest run --shard=4/4 --reporter=default --reporter=github-actions
